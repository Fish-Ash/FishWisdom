        <h1>矢量</h1>
        
        <div class="Card-Analysis">
            <h2>矢量</h2>
            <div class="Card-Definition">
                <b>矢量</b>
                <p>在三维Euclidean空间中，矢量是具有大小与方向且满足一定规则的实体.</p>
                <p>通常用黑体字母表示，如：\(\boldsymbol{u}, \boldsymbol{v}\)等.</p>
            </div>

            <p>矢量满足以下规则：</p>
            <p>相等：两个矢量具有相同的模和方向，称这两个矢量相等.</p>
            <p>矢量和：按照平行四边形法则定义矢量和，同一空间中的两个矢量之和仍为该空间的矢量.</p>
        </div>
