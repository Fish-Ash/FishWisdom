        <h1>坐标系</h1>

        <div class="Card-Analysis">
            <h2>球坐标系</h2>
            <img src="Img/SphericalCoordinate.png" width="300">
            <p>点P的球坐标为：\((r,\theta,\phi)\).</p>
            <ul>
                <li>\(r\)：到原点的距离（位置矢量的大小）</li>
                <li>\(\theta\)：极角，位置矢量与z轴的夹角</li>
                <li>\(\phi\)：方位角，位置矢量在xy平面投影与x轴的夹角</li>
            </ul>
            <p>球坐标\((r,\theta,\phi)\)与直角坐标\(x,y,z\)的关系为：</p>
            $$x = r\sin\theta\cos\phi$$
            $$y = r\sin\theta\sin\phi$$
            $$z = r\cos\theta$$
