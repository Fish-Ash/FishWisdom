        <h1>椭圆</h1>

        <div class="Card-AI">
            <p>若椭圆的长轴与短轴分别为\(2a,2b\)，且其长轴相对于x轴偏转了\(\phi\)角度，则有：</p>
            $$\frac{(x\cos\phi + y\sin\phi)^2}{a^2} + \frac{(-x\sin\phi + y\cos\phi)^2}{b^2} = 1$$
