        <h1>晶体双折射</h1>

        <p>以方解石晶体为例，讨论晶体中的双折射现象.</p>

        <div class="Card-Definition">
            <b>寻常光线（o光线）</b>
            <p>双折射中符合折射定律的光线.</p>
            <p>为线偏振光.</p>
        </div>

        <div class="Card-Definition">
            <b>非常光线（e光线）</b>
            <p>双折射中不符合折射定律的光线.</p>
            <p>为线偏振光./p>
        </div>

        <div class="Card-AI">
            <p>o光与e光的概念只有单轴晶体中存在（方解石是负单轴晶体），且其概念与单轴晶体中的o光与e光等同.</p>
            <p>也就是说，单轴晶体中发生双折射时，一束折射光偏振方向垂直于主平面，另一束平行.</p>
        </div>
