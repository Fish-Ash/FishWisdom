        <h1>截止滤光片</h1>
        <div class="Card-Definition">
            <b>截止滤光片</b>
            <p>光学性能从截止区到透射区发生突变的滤光片.</p>
            <div class="Card-AI">
                <p>截止区就是高反区.</p>
            </div>
            <table>
                <tr>
                    <td rowspan="2">截止滤光片</td>
                    <td>长波通滤光片</td>
                </tr>
                <tr><td>短波通滤光片</td></tr>
            </table>
            <div class="Card-AI">
                <p>长波通：长波通过，短波截止</p>
                <p>短波通：短波通过，长波截止</p>
            </div>
        </div>

        <div class="Card-Analysis">
            <h2>薄膜型吸收滤光片</h2>
            <p>薄膜型吸收滤光片由某种材料的单层膜构成，这种材料的吸收边要求正好位于要求的波长.</p>
            <div class="Card-AI">
                <p>吸收边，也叫吸收限，是材料本征吸收开始剧烈增强的那个波长或频率边界.</p>
            </div>
            <p>薄膜型吸收滤光片通常具有长波通特性.</p>
        </div>

        <div class="Card-AI">
            <p>二向色镜本质上是截止滤光片（按波长分光）.</p>
        </div>
