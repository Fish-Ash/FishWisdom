        <h1>激光调制技术</h1>

        <div class="Card-Definition">
            <b>调制</b>
            <p>将信息加载于激光的过程.</p>
        </div>

        <div class="Card-Definition">
            <b>调制器</b>
            <p>用于调制激光的装置.</p>
        </div>

        <div class="Card-Definition">
            <b>载波</b>
            <p>被调制的激光</p>
        </div>

        <b>分类</b>
        <p>依据调制器与激光器的相对位置关系分：</p>
        <ul>
            <li>内调制</li>
            <li>外调制</li>
        </ul>

        <p>依据调制的性质分：</p>
        <ul>
            <li>调幅</li>
            <li>调相</li>
            <li>强度调制</li>
        </ul>

        <div class="Card-Analysis">
            <h2>振幅调制</h2>
            <div class="Card-Definition">
                <b>调幅（振幅调制，AM）</b>
            </div>

            <p>激光载波的电场强度：</p>
            $$E_c(t) = A_c\cos(\omega_c t + \phi_c)$$
        </div>

        <div class="Card-Analysis">
            <h2>电光调制</h2>
            <div class="Card-Definition">
                <b>电光效应</b>
                <p>某些晶体或液体在外加电场作用下，其折射率将发生改变.</p>
            </div>
        </div>
