        <h1>米氏散射共振</h1>

        <div class="Card-AI">
            <p>米氏散射共振简称米氏共振.</p>
            <p>米氏共振是一种体共振.</p>
            <p>米氏共振关注的是光电场的振动方向而非传播方向.</p>
            <p>米氏共振一定形成驻波，但是驻波不一定是米氏共振.</p>
            <p>归根结底，米氏共振的形成条件是相位差（相长干涉）.</p>
