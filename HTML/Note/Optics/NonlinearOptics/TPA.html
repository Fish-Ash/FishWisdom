            <h2>双光子吸收</h2>


            <h3>双光子吸收现象</h3>

            <p>当用红宝石激光照射掺铕氟化钙晶体时，可以探测到相应于两倍红宝石激光频率跃迁的荧光.</p>
            <p>由于该晶体不存在与单个红宝石激光光子相应的任何激发态，所以不能用连续吸收两个红宝石激光光子来解释这种现象.</p>
            <p>又由于掺铕氟化钙晶体属于立方晶体，因此不可能发生二次谐波产生过程.</p>

            <p>因此，上述现象的唯一解释是：同时吸收两个光子产生的效应.</p>
