        <div class="Card-Analysis">
            <h2>非线性光学材料选取原则</h2>

            <ul>
                <li>具有较大的非线性极化率：有时即使材料的非线性极化率不是很大，也可以通过增强入射光功率等方式获得所要求的非线性光学效应.</li>
                <li>具有合适的透明程度及足够的光学均匀性：在非线性光学工作频段内，材料对光的有害吸收及散射损耗应尽量小.</li>
                <li>容易实现相位匹配.</li>
                <li>损伤阈值高：能够承受较大的激光功率或能量.</li>
                <li>具有合适的响应时间：能够对宽度不同的脉冲激光或连续激光做出足够的响应.</li>
            </ul>
        </div>
