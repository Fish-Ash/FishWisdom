        <h1>二维光子晶体</h1>

        <div class="Card-Analysis">
            <h2>二维Bloch态</h2>

            <p>二维光子晶体沿其两个轴是周期性的，而沿第三个轴是均匀的.</p>
            <p>如图所示为一种典型的四方晶格光子晶体.</p>
            <img src="Img/PhotonicCrystals_2D.jpg" width="400">
            <p>这里假设介质柱无限高.</p>
            <p>特定周期下，该结构在\(xy\)面内拥有光子带隙.</p>
            <p>这个带隙中，光子晶体不存在任何扩展态，入射波会被反射.</p>
            <p>与多层膜不同，这种二维光子晶体可以阻止光沿平面内任何方向进行传播.</p>

            <div class="Card-AI">
                <p>?光子带隙</p>
                <p>?扩展态</p>
            </div>

            <p>仍可以利用晶体的对称性对电磁波模式进行分类.</p>
            <p>由于二维光子晶体在\(z\)轴上是均匀的，因此电磁波的空间模式一定在这个方向上振荡，波矢\(k_z\)可以是任意值.</p>
