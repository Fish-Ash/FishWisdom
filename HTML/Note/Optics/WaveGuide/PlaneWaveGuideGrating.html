        <h1>平面波导光栅</h1>

        <div class="Card-Analysis">
            <h2>介绍</h2>
            <p>波导内部微细的周期性结构形成了平面波导光栅，已被广泛应用于集成光路中：</p>
            <ul>
                <li>输入输出耦合器</li>
                <li>波长滤波器</li>
                <li>波分复用器</li>
                <li>模变换器</li>
                <li>...</li>
            </ul>
            <p>波导光栅不仅可以用来制作无源器件，也可以用来制作光波调制用的有源器件，是集成光路的重要元件之一.</p>

            <p>波导光栅在结构上可分为<b>折射率调制型</b>与<b>起伏型</b>.</p>
