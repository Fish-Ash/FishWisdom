        <h1>Hall效应</h1>

        <div class="Card-Definition">
            <b>Hall效应</b>
            <p>将一导电板放在垂直于它的磁场中，当有电流通过它时，在导电板的AA'两侧会产生电势差\(U_{AA'}\).</p>
            <img src="Img/HallEffect.jpg" alt="" width="200">
            <p>磁场不太强时，电势差\(U_{AA'}\)与电流强度\(I\)与磁感应强度\(B\)成正比，与板的厚度\(d\)成反比，即：</p>
            $$U_{AA'} = K\frac{IB}{d}$$
            <p>其中比例系数\(K\)称为<b>Hall系数</b>.</p>
        </div>
