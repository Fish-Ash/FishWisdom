        <h1>自感</h1>

        <p>当一线圈中的电流变化时，其所激发的磁场通过线圈自身的磁通量（或磁通匝链数）也在变化，使线圈产生感应电动势.</p>
        <p>这种因线圈中电流变化而在线圈自身所引起的感应现象叫做<b>自感现象</b>，所产生的电动势称为<b>自感电动势</b>.</p>
        
        <div class="Card-Question">
            <p>线圈中通电流为什么会产生磁场？</p>
            <p>什么叫自感电动势？</p>
