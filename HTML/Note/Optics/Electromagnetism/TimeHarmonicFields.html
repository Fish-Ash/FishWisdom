    <h1>时谐场</h1>
    <p>波动方程中的时间依赖关系可以轻易分离出来，从而得到一个谐波微分方程.</p>
    <p>因此，单色场可以写为：</p>
    $$\boldsymbol{E}(\boldsymbol{r}, t) = \text{Re}\left\{\boldsymbol{E}(\boldsymbol{r})e^{-i\omega t}\right\} = \frac{1}{2}\left[\boldsymbol{E}(\boldsymbol{r})e^{-i\omega t} + \boldsymbol{E}^*(\boldsymbol{r})e^{i\omega t}\right]$$
