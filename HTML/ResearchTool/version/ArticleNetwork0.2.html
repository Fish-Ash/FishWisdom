<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>ArticleNetwork</title>
    <style>
        /* 基础样式 */
        body{
            margin: 0;
        }
        /* 上下文菜单 */
        #contextMenu {
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 8px;
            width: 120px;
        }

        #contextMenu button{
            display: block;
            width: 100px;
            background: none;
            border: none;
            font-size: 20px;
            margin-left: 10px;
        }

        #contextMenu button:hover{
            background-color: #ccc;
        }

        /* 画布铺屏 */
        #network{
            width: 100vw;
            height: 100vh;
        }

        /* 侧边栏 */
        #settingsTab{
        position: fixed;
        right: 0;
        top: 10vh;
        width: 70px;
        height: 50px;
        border: none;
        clip-path: polygon(20% 0, 100% 0, 100% 100%, 20% 100%, 0 50%);
        }

        #listTab{
        position: fixed;
        right: 0;
        top: 17vh;
        width: 70px;
        height: 50px;
        border: none;
        clip-path: polygon(20% 0, 100% 0, 100% 100%, 20% 100%, 0 50%);
        }

        #sideBar{
            position: fixed;
            width: 30vw;
            height: 100vh;
            top: 0px;
            right: 0px;
            background-color: aquamarine;
        }

        #sideBar p:hover{
            background-color: aqua;
        }

        #authorContextMenu {
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 8px;
            width: 120px;
        }

        #authorContextMenu button{
            display: block;
            width: 100px;
            background: none;
            border: none;
            font-size: 20px;
            margin-left: 10px;
        }

        #authorContextMenu button:hover{
            background-color: #ccc;
        }
        /* 我想，星空样式 */
    </style>
</head>

<body>
    <!-- 上下文菜单 -->
    <div id="contextMenu" hidden>
        <button id="addArticleButton">新增</button>
        <button id="importButton">导入</button>
        <button id="exportButton">导出</button>
    </div>

        <br><br>

        <button id="cancelButton">取消</button>

    <!-- 画布 -->
    <svg id="network"></svg>

    <div id="sideBar" hidden>
        <h2 id="sideBarTitle"></h2>
    </div>

    <button id="settingsTab">设置</button>
    <button id="listTab">列表</button>

    <div id="authorContextMenu" hidden>
        <button id="authorDelButton">删除</button>
    </div>
